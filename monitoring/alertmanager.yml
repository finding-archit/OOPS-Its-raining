global:
  resolve_timeout: 5m
  # To enable email alerts, update these fields with your details
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'archit.gupta865@gmail.com'
  smtp_auth_username: 'archit.gupta865@gmail.com'
  # Generate an App Password in your Google Account settings

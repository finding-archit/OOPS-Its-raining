global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10m
  repeat_interval: 1h
  receiver: 'app-webhook'

receivers:
- name: 'app-webhook'
  webhook_configs:
  # Sends alerts to the FastAPI app running on port 8000
  - url: 'http://app:8000/webhook/alerts'
    send_resolved: true
